name: Caça Placa Backend CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  lint:
    name: Lint & Formatação
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Instalar uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true

      - name: Instalar Dependências de Lint
        run: uv pip install --system ruff

      - name: Linter & Format (Ruff)
        run: ruff check src tests

  test:
    name: Testes
    runs-on: ubuntu-latest
    
    services:
      db:
        image: postgis/postgis:15-3.3-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cacaplaca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Código (Com Histórico)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true

      - name: Instalar Dependências
        run: uv pip install --system -e ".[dev]"

      - name: Executar Pytest (Gera coverage.xml)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cacaplaca_test
          SECRET_KEY: test-secret-key-for-ci-only
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 60
          FRONTEND_URL: http://localhost:5173
        run: pytest

      - name: Diff-Cover (Quebra se < 85% nas linhas novas do PR)
        if: github.event_name == 'pull_request'
        run: diff-cover coverage.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=85
