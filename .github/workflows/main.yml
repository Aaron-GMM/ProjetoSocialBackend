name: Caça Placa Backend CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cacaplaca_test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: cacaplaca_test
  SECRET_KEY: test-secret-key-for-ci-only
  ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: 60
  RESET_TOKEN_EXPIRE_MINUTES: 15
  FRONTEND_URL: http://localhost:5173
  MAIL_SERVER: smtp.gmail.com
  MAIL_PORT: 587
  EMAIL: ci@cacaplaca.local
  EMAIL_PASSWORD: ci-test-password
  MINIO_ROOT_USER: ci-root-user
  MINIO_ROOT_PASSWORD: ci-root-password
  MINIO_ENDPOINT: localhost:9000
  MINIO_PUBLIC_URL: http://localhost:9000
  MINIO_APP_ACCESS_KEY: ci-access-key
  MINIO_APP_SECRET_KEY: ci-secret-key
  MINIO_BUCKET_NAME: cacaplaca-images
  MINIO_SECURE: "false"

jobs:
  lint:
    name:  lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true

      - name: Instalar Ruff
        run: uv pip install --system ruff

      - name: Executar Linter
        run: ruff check src tests

  formatacao:
    name: format
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true

      - name: Instalar Ruff
        run: uv pip install --system ruff

      - name: Verificar Formatação
        run: ruff format --check src tests

  db-migrations:
    name: alembic
    runs-on: ubuntu-latest
    needs: formatacao

    services:
      db:
        image: postgis/postgis:15-3.3-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cacaplaca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true

      - name: Instalar Dependências
        run: uv pip install --system -e .

      - name: Validar Migrations
        run: alembic upgrade head

  testes:
    name: testes
    runs-on: ubuntu-latest
    needs: db-migrations

    services:
      db:
        image: postgis/postgis:15-3.3-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cacaplaca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Código (Com Histórico)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true

      - name: Instalar Dependências
        run: uv pip install --system -e ".[dev]"

      - name: Executar Pytest (Gera coverage.xml)
        run: pytest

      - name: Diff-Cover
        if: github.event_name == 'pull_request'
        run: diff-cover coverage.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=85

  docker-build:
    name: build
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Validar docker-compose.yml
        run: docker compose config -q

      - name: Build da Imagem Docker
        run: docker build -t caca-placa-api:ci .

      - name: Test Container
        run: |
          docker run --rm \
            -e DATABASE_URL="$DATABASE_URL" \
            -e SECRET_KEY="$SECRET_KEY" \
            -e ALGORITHM="$ALGORITHM" \
            -e ACCESS_TOKEN_EXPIRE_MINUTES="$ACCESS_TOKEN_EXPIRE_MINUTES" \
            -e RESET_TOKEN_EXPIRE_MINUTES="$RESET_TOKEN_EXPIRE_MINUTES" \
            -e FRONTEND_URL="$FRONTEND_URL" \
            -e MAIL_SERVER="$MAIL_SERVER" \
            -e MAIL_PORT="$MAIL_PORT" \
            -e EMAIL="$EMAIL" \
            -e EMAIL_PASSWORD="$EMAIL_PASSWORD" \
            -e MINIO_ENDPOINT="$MINIO_ENDPOINT" \
            -e MINIO_PUBLIC_URL="$MINIO_PUBLIC_URL" \
            -e MINIO_APP_ACCESS_KEY="$MINIO_APP_ACCESS_KEY" \
            -e MINIO_APP_SECRET_KEY="$MINIO_APP_SECRET_KEY" \
            -e MINIO_BUCKET_NAME="$MINIO_BUCKET_NAME" \
            -e MINIO_SECURE="$MINIO_SECURE" \
            caca-placa-api:ci \
            python -c "from src.main import app; assert app.title == 'Caça Placa API'; print('Container e FastAPI validados com sucesso!')"
